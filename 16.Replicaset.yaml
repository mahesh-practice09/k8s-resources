apiVersion: apps/v1 
kind: ReplicaSet 
metadata: 
  name: nginx
  labels:
    project: roboshop 
    purpose: rs-demo 
    tier: frontend
    component: frontend 
spec:
  replicas: 3 
  selector:
    # using this labels replica set selects the pod
    matchLabels:
       project: roboshop 
       purpose: rs-demo 
       tier: frontend 
       component: frontend 
  # this is POD Definition ,pod is subset of replicaset
  template:
     metadata:
       labels: 
           project: roboshop 
           purpose: rs-demo 
           tier: frontend
           component: frontend 
     spec:
       Containers:
         - name: nginx 
           image: nginx