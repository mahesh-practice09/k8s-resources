apiVersion: v1 
kind: Pod 
metadata: 
  name: resources-demo
  labels: 
    project: roboshop 
    component: frontend 
    env: dev 
spec: 
  containers:
    - name: nginx 
      image: nginx 
      resources: 
        # soft limit 
       requests:
         memory: "64Mi" #RAM
         cpu: "100m" #CPU
        # hard limit
       limits:
         memory: "128Mi"
         cpu: "128m"